[package]
name = "md-indexer-desktop"
version = "0.5.0"
description = "Desktop client for md-indexer: vault selection, model selection and grounded Q&A"
authors = ["Zheng-Bote"]
license = "Apache-2.0"
repository = ""
edition = "2024"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "md_indexer_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "2.12.4", features = [] }
tauri-plugin-shell = "2.5.0"
tauri-plugin-dialog = "2.8.3"
tauri-plugin-store = "2.5.0"
tauri-plugin-http = "2.8.3"
sha2 = "0.11.1"
tokio = { version = "1.53.3", features = ["time", "net", "io-util"] }
